version: "3.8"

networks:
  agentraas-net:
    name: agentraas-net
    driver: bridge

services:
  ar-redis:
    image: docker.io/redis:7-alpine
    container_name: ar-redis
    hostname: ar-redis
    networks:
      - agentraas-net
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ./data/redis:/data:z
    command: redis-server --appendonly yes
    restart: always

  ar-postgres:
    image: docker.io/postgres:15-alpine
    container_name: ar-postgres
    hostname: ar-postgres
    networks:
      - agentraas-net
    # POSTGRES_PASSWORD comes from .env via env_file, not an explicit
    # `environment:` mapping — podman-compose passes env_file as a bare
    # --env-file <path> to `podman run`, so the value never appears in its
    # own (very verbose) command-echo, unlike `-e KEY=value`. Same reasoning
    # for every other service below with secrets. See the incident this
    # fixed: a `--force-recreate` command-echo leaked the full production
    # secret set into an AI session transcript (twice).
    env_file:
      - .env
    environment:
      POSTGRES_USER: agentraas
      POSTGRES_DB: agentraas
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:z
      - ./infra/migrations:/docker-entrypoint-initdb.d:z
    restart: always

  ar-minio:
    image: quay.io/minio/minio:latest
    container_name: ar-minio
    hostname: ar-minio
    networks:
      - agentraas-net
    # MINIO_ROOT_USER/PASSWORD come from .env via env_file — see ar-postgres
    # above for why.
    env_file:
      - .env
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - ./data/minio:/data:z
    command: server /data --console-address ":9001"
    restart: always

  # The API/dashboard service — Node's ar-api was retired once this fully
  # took over production traffic; no longer behind a `profiles: ["rust"]`
  # gate, this is just the default service now.
  ar-api-rs:
    build:
      context: ./src/api-gateway-rs
      dockerfile: Containerfile
    container_name: ar-api-rs
    hostname: ar-api-rs
    networks:
      - agentraas-net
    # Secrets (DATABASE_URL, JWT_SECRET, CREDENTIALS_ENCRYPTION_KEY,
    # SMTP_USER/PASS, PADDLE_*, LICENSE_SIGNING_PRIVATE_KEY, LICENSE_TOKEN)
    # come from .env via env_file, not an explicit `environment:` mapping —
    # see ar-postgres above for why.
    env_file:
      - .env
    environment:
      RUST_LOG: "info"
      PORT: 3000
      REDIS_URL: redis://ar-redis:6379
      # Was missing entirely until 2026-09-06: with no SMTP_HOST, `Mailer::
      # is_configured()` is always false, so every registration/password-
      # reset response unconditionally included a working dev_verify_url —
      # on production this meant real verification emails were silently
      # never sent via this service, mirroring ar-api's own SMTP_* block above.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      # Was missing entirely until the Team-tier work (2026-09-07): ar-api-rs
      # is the actual public-facing billing endpoint now, but had none of
      # these — billing_checkout_info/paddle_webhook always 503'd
      # "not configured" regardless of what was set in .env, since a
      # podman-compose environment var only reaches the container if it's
      # declared here, unlike ar-api's own PADDLE_* block above. Real price
      # IDs get set in .env later — this just wires the plumbing through.
      PADDLE_TEAM_PRICE_ID: "${PADDLE_TEAM_PRICE_ID:-}"
      PADDLE_ENVIRONMENT: "${PADDLE_ENVIRONMENT:-sandbox}"
      SMTP_FROM: "${SMTP_FROM:-}"
      EXPOSE_DEV_VERIFY_URL: "${EXPOSE_DEV_VERIFY_URL:-false}"
      # DEPLOYMENT_MODE was already ar-api's own convention (cloud vs
      # self-hosted); ar-api-rs never had it wired through either, same
      # gap as the PADDLE_* vars above. A self-hosted Team/Enterprise
      # deployment sets LICENSE_TOKEN (from the dashboard's "your license"
      # panel, a later task) to unlock paid features; missing/invalid/
      # expired always degrades gracefully to Community, never blocks
      # startup.
      DEPLOYMENT_MODE: "${DEPLOYMENT_MODE:-cloud}"
      # Enterprise features (SSO/RBAC/DLP/inbound-webhook HMAC/maintenance)
      # are opt-in even here — this only ever affects ar-api-rs, never the
      # real ar-api (Node) or production, matching how ENTERPRISE_MODE is
      # meant to be operator-controlled.
      ENTERPRISE_MODE: "true"
    ports:
      # Kept at 13001 (not the "default" 13000 discussed for fresh setups)
      # because production's Caddy already reverse_proxy's to :13001 from
      # the original cutover, and flipping this requires a manual Caddy
      # edit (sudo-over-SSH is blocked for this harness) — changing it here
      # without that coordinated edit would take agentraas.io down.
      - "127.0.0.1:13001:3000"
    # No depends_on: podman-compose 1.5.0 doesn't reliably recognize
    # ar-redis/ar-postgres as already-satisfied dependencies when starting
    # this service via --profile — it tries to "ensure" them, hits a name
    # conflict against the already-running containers, and in doing so
    # actually restarts them (confirmed: this briefly dropped ar-api's live
    # Redis connection). ar-redis/ar-postgres are always already up via the
    # main stack in normal use; ar-api-rs just fails fast with a clear error
    # on boot if they're genuinely not reachable.
    volumes:
      - ./config:/config:ro,z
      # Static marketing/dashboard pages (landing.html, index.html, vendor
      # JS) and the source tree the self-host download package/doc pages
      # are read from — same read-only sharing pattern as ./config above,
      # never writable from this container.
      - ./src/api-gateway-rs/public:/public:ro,z
      - .:/repo:ro,z
      # SPEC-M7.md: the prebuilt Enterprise-image tarball, exported by
      # the deploy host (this container has no podman/container-runtime
      # access to do that itself) - see project_plan/deploy.md's extra
      # M7 deploy step. Missing/empty directory is fine; self_host.rs
      # degrades to a clear 503 on the Team+ download path, not a crash.
      - ./self-host-artifacts:/self-host-artifacts:ro,z
    restart: "no"

  # Optional: agentgateway (github.com/agentgateway/agentgateway) in front
  # of ar-api-rs's MCP endpoint — see config/agentgateway.yaml for what
  # this buys you and why it needs no code changes on AgentRaaS's side.
  # Available on every tier, not gated — opt-in via its own profile since
  # most deployments don't need a second proxy layer in front of AgentRaaS.
  agentgateway:
    profiles: ["agentgateway"]
    image: ghcr.io/agentgateway/agentgateway:v1.5.0
    container_name: agentgateway
    hostname: agentgateway
    command: ["-f", "/config/agentgateway.yaml"]
    networks:
      - agentraas-net
    ports:
      - "127.0.0.1:13005:3005"
    volumes:
      - ./config/agentgateway.yaml:/config/agentgateway.yaml:ro,z
    restart: "no"
