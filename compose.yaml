version: "3.8"

networks:
  agentraas-net:
    name: agentraas-net
    driver: bridge

services:
  ar-redis:
    image: docker.io/redis:7-alpine
    container_name: ar-redis
    hostname: ar-redis
    networks:
      - agentraas-net
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ./data/redis:/data:z
    command: redis-server --appendonly yes
    restart: always

  ar-postgres:
    image: docker.io/postgres:15-alpine
    container_name: ar-postgres
    hostname: ar-postgres
    networks:
      - agentraas-net
    # Secrets come from .env via env_file, never an `environment:` mapping:
    # podman-compose echoes `-e KEY=value` in its command output (and so into
    # logs), while env_file is passed as a bare --env-file path. Same for
    # every service below.
    env_file:
      - .env
    environment:
      POSTGRES_USER: agentraas
      POSTGRES_DB: agentraas
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:z
      - ./infra/migrations:/docker-entrypoint-initdb.d:z
    restart: always

  ar-minio:
    # Docker Hub and quay.io both refuse anonymous MinIO pulls now; Chainguard's
    # free image still pulls. It defaults to UID 65532, so run as root like the
    # old image did, or existing ./data/minio files become unwritable.
    image: cgr.dev/chainguard/minio:latest
    user: "0"
    container_name: ar-minio
    hostname: ar-minio
    networks:
      - agentraas-net
    # MINIO_ROOT_USER/PASSWORD come from .env (see ar-postgres).
    env_file:
      - .env
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - ./data/minio:/data:z
    command: server /data --console-address ":9001"
    restart: always

  # The API and dashboard (Rust).
  ar-api-rs:
    build:
      context: ./src/api-gateway-rs
      dockerfile: Containerfile
    container_name: ar-api-rs
    hostname: ar-api-rs
    networks:
      - agentraas-net
    # Secrets (DATABASE_URL, JWT_SECRET, CREDENTIALS_ENCRYPTION_KEY,
    # SMTP_USER/PASS, PADDLE_*) come from .env (see ar-postgres).
    env_file:
      - .env
    environment:
      RUST_LOG: "info"
      PORT: 3000
      REDIS_URL: redis://ar-redis:6379
      # Without SMTP_HOST no email is sent: verification links are logged
      # (and, with EXPOSE_DEV_VERIFY_URL, returned in the response).
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      # Paddle checkout; the secret PADDLE_* values come from .env.
      PADDLE_TEAM_PRICE_ID: "${PADDLE_TEAM_PRICE_ID:-}"
      PADDLE_ENVIRONMENT: "${PADDLE_ENVIRONMENT:-sandbox}"
      SMTP_FROM: "${SMTP_FROM:-}"
      EXPOSE_DEV_VERIFY_URL: "${EXPOSE_DEV_VERIFY_URL:-false}"
      # Anything but "cloud" is self-host: every feature on, no usage limit.
      DEPLOYMENT_MODE: "${DEPLOYMENT_MODE:-cloud}"
      # Turns on the server-wide Enterprise switches: DLP-redacted previews
      # in the audit log, tool output sanitization, maintenance mode, and
      # the admin audit-integrity check and SIEM export.
      ENTERPRISE_MODE: "true"
    ports:
      # 13001: production's cloudflared tunnel and the docs point here;
      # change them together.
      - "127.0.0.1:13001:3000"
    # No depends_on: podman-compose 1.5 tries to "ensure" already-running
    # dependencies and restarts them on a name conflict. The API fails fast
    # with a clear error if Redis/Postgres aren't up, and restart: on-failure
    # brings it back once they are.
    volumes:
      - ./config:/config:ro,z
      # Static marketing/dashboard pages (landing.html, index.html, vendor
      # JS) and the source tree the self-host download package/doc pages
      # are read from — same read-only sharing pattern as ./config above,
      # never writable from this container.
      - ./src/api-gateway-rs/public:/public:ro,z
      - .:/repo:ro,z
    # on-failure: after a cold boot DNS can lag network-online.target, and
    # the first start fails on "Temporary failure in name resolution".
    restart: on-failure

  # Optional: agentgateway (github.com/agentgateway/agentgateway) in front
  # of ar-api-rs's MCP endpoint — see config/agentgateway.yaml for what
  # this buys you and why it needs no code changes on AgentRaaS's side.
  # Available on every tier, not gated — opt-in via its own profile since
  # most deployments don't need a second proxy layer in front of AgentRaaS.
  agentgateway:
    profiles: ["agentgateway"]
    image: ghcr.io/agentgateway/agentgateway:v1.5.0
    container_name: agentgateway
    hostname: agentgateway
    command: ["-f", "/config/agentgateway.yaml"]
    networks:
      - agentraas-net
    ports:
      - "127.0.0.1:13005:3005"
    volumes:
      - ./config/agentgateway.yaml:/config/agentgateway.yaml:ro,z
    restart: "no"
