name: Rust tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: src/api-gateway-rs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/api-gateway-rs

      - name: cargo test
        # No --features enterprise matrix entry here (unlike the private
        # repo's version of this file) - this repo doesn't contain ee/
        # source at all, so that build can never pass regardless of code
        # correctness. This repo only ever ships the Community edition.
        run: cargo test --workspace
