{{- if not .Values.existingSecret }}
{{- $name := include "agentraas.name" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $pgPass := .Values.postgresql.password | default ((get $old "POSTGRES_PASSWORD") | default "" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "agentraas.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ .Values.jwtSecret | default ((get $old "JWT_SECRET") | default "" | b64dec) | default (randAlphaNum 64) | b64enc }}
  CREDENTIALS_ENCRYPTION_KEY: {{ .Values.credentialsEncryptionKey | default ((get $old "CREDENTIALS_ENCRYPTION_KEY") | default "" | b64dec) | default (randBytes 32) | b64enc }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $pgPass | b64enc }}
  DATABASE_URL: {{ printf "postgres://agentraas:%s@%s-postgres:5432/agentraas" $pgPass $name | b64enc }}
  {{- else }}
  DATABASE_URL: {{ required "externalDatabase.url is required when postgresql.enabled=false" .Values.externalDatabase.url | b64enc }}
  {{- end }}
  {{- with .Values.metricsToken }}
  METRICS_TOKEN: {{ . | b64enc }}
  {{- end }}
{{- end }}
