<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#FFFFFF;font-family:Inter,sans-serif;color:#0E1116;overflow:hidden}
.f{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.f::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:#111418}
.brand{display:flex;align-items:center;gap:16px;font:700 30px Inter}
.tile{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(180deg,#1D2127,#121418);box-shadow:inset 0 0 0 1.5px #2E343C}
h1{font:800 76px/1.04 Inter;letter-spacing:-0.04em;margin-top:auto;max-width:980px}
h1 span{color:#9A5B00}
p{font:500 26px Inter;color:#4A5260;margin:22px 0 34px}
.row{display:flex;justify-content:space-between;align-items:center}
.cmd{font:500 23px 'JetBrains Mono';background:#0D1014;color:#ECEFF3;border-radius:8px;padding:12px 18px}
.cmd b{color:#7CB8E0;font-weight:500}
.url{font:500 23px 'JetBrains Mono';color:#626B78}
</style></head><body><div class="f">
<div class="brand"><div class="tile"><svg width="28" height="28" viewBox="0 0 24 24"><circle cx="8.6" cy="12" r="5.1" fill="none" stroke="#ECEFF3" stroke-width="1.9"/><circle cx="15.4" cy="12" r="5.1" fill="#F2B544"/></svg></div>AgentRaaS</div>
<h1>The reliability layer for <span>what AI agents do.</span></h1>
<p>Run each call once. Check it against policy. Ask a human when it is risky. Record it.</p>
<div class="row"><div class="cmd"><b>$</b> pip install agentraas</div><div class="url">agentraas.io</div></div>
</div></body></html>
