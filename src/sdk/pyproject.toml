[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentraas"
version = "0.7.0"
description = "Reliability layer for AI agent actions: exactly-once tool calls (@exactly_once, LangChain protect_tool, MCP wrap), a chaos tester for duplicate calls, and the AgentRaaS client for policies, approvals and audit"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sumedh Chatse" }]
requires-python = ">=3.8"
dependencies = ["requests>=2.28.0"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["mcp-server", "model-context-protocol", "chaos-testing", "exactly-once", "deduplication", "ai-agents", "idempotency", "mcp", "webhooks", "n8n", "reliability", "langchain", "langgraph"]

[project.optional-dependencies]
redis = ["redis>=4.0"]
tunnel = ["websocket-client>=1.0"]
langchain = ["langchain-core>=0.3"]
apply = ["pyyaml>=5.1"]

[project.scripts]
agentraas = "agentraas.cli:main"
agentraas-chaos = "agentraas.chaos:main"

[project.urls]
Homepage = "https://github.com/sumedhchatse/agentraas"
Repository = "https://github.com/sumedhchatse/agentraas"
Documentation = "https://github.com/sumedhchatse/agentraas#readme"
Issues = "https://github.com/sumedhchatse/agentraas/issues"

[tool.setuptools.packages.find]
include = ["agentraas*"]
