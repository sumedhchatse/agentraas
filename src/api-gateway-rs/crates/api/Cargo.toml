[package]
name = "api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ar-api-rs"
path = "src/main.rs"

[features]
default = []
# Enterprise tier — SSO/RBAC, DLP redaction, inbound-webhook HMAC/ECDSA
# verification, Pause & Buffer maintenance queue. Off by default; the
# Community-edition public repo is built with no feature flags at all,
# so this code doesn't even compile in there, mirroring `src/ee` being
# absent from that repo's Node tree.
enterprise = ["agentraas-core/enterprise"]

[dependencies]
agentraas-core = { path = "../core" }

axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

sqlx = { version = "0.7", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono"] }
redis = { version = "0.25", features = ["tokio-comp"] }

dotenvy = "0.15"
anyhow = "1"
async-trait = "0.1"

bcrypt = "0.15"
jsonwebtoken = "9"
time = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "pool", "builder"] }
url = "2"
tokio-stream = "0.1"
futures-util = "0.3"
walkdir = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
hmac = "0.12"
