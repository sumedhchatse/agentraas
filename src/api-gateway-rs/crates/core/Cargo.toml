[package]
name = "agentraas-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: dedup hashing must byte-match Node's JSON.stringify, which
# preserves a JS object's insertion order (not alphabetical) — see
# dedup.rs's module doc for why this actually matters for correctness, not
# just style.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
redis = { version = "0.25", features = ["tokio-comp"] }
rand = "0.8"
tokio = { version = "1", features = ["time"] }
aes-gcm = "0.10"
base64 = "0.21"

# Enterprise-tier only (src/ee/{dlp,hmac} equivalents) — optional,
# pulled in only when the `enterprise` feature is enabled, so a
# Community-edition build doesn't even fetch these.
regex = { version = "1", optional = true }
once_cell = { version = "1", optional = true }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
p256 = { version = "0.13", features = ["ecdsa", "pem"], optional = true }

[features]
default = []
enterprise = ["dep:regex", "dep:once_cell", "dep:hmac", "dep:sha1", "dep:p256"]
